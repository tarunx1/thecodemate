# thecodemate.com — Next.js owns every public route; FastAPI (127.0.0.1:8020) stays private behind it.
server {
    listen 80;
    listen [::]:80;
    server_name thecodemate.com www.thecodemate.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://thecodemate.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thecodemate.com;
    ssl_certificate /etc/letsencrypt/live/thecodemate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecodemate.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://thecodemate.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thecodemate.com;
    ssl_certificate /etc/letsencrypt/live/thecodemate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecodemate.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads are capped at 9 MiB by the application.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
